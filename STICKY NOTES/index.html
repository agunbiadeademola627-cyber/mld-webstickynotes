<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- Dashboard View -->
        <div id="dashboard-view" class="view active">
            <header>
                <h1>Sticky Notes</h1>
                <button id="btn-new-note" class="btn-primary" title="Create New Note"><i class="fas fa-plus"></i></button>
            </header>
            <div id="notes-grid" class="notes-grid">
                <!-- Notes will be injected here -->
            </div>
        </div>

        <!-- Note Editor View -->
        <div id="editor-view" class="view">
            <div id="active-note" class="note-window color-yellow">
                <header class="note-header">
                    <button id="btn-back" class="btn-icon" title="Back to Notes"><i class="fas fa-arrow-left"></i></button>
                    <div class="color-picker-container">
                        <button class="btn-icon" id="btn-color-picker" title="Change Color"><i class="fas fa-palette"></i></button>
                        <div id="color-palette" class="color-palette hidden">
                            <div class="color-swatch bg-yellow" data-color="color-yellow"></div>
                            <div class="color-swatch bg-green" data-color="color-green"></div>
                            <div class="color-swatch bg-pink" data-color="color-pink"></div>
                            <div class="color-swatch bg-blue" data-color="color-blue"></div>
                            <div class="color-swatch bg-purple" data-color="color-purple"></div>
                            <div class="color-swatch bg-gray" data-color="color-gray"></div>
                        </div>
                    </div>
                    <div class="header-actions" style="display: flex; gap: 0.25rem;">
                        <button id="btn-pip" class="btn-icon" title="Pop out Note (PiP)"><i class="fas fa-external-link-alt"></i></button>
                        <button id="btn-delete" class="btn-icon" title="Delete Note"><i class="fas fa-trash"></i></button>
                    </div>
                </header>
                <div class="note-body">
                    <input type="text" id="note-title" class="note-title-input" placeholder="Title...">
                    <div class="note-meta">
                        <span id="note-date"></span>
                    </div>
                    <textarea id="note-content" class="note-content-input" placeholder="Start typing..."></textarea>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
